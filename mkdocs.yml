site_name: MLRacecar
site_description: Design a race track, train an AI to master it with reinforcement learning, then race it.
site_url: https://taofuuu.github.io/MLRacecar/
site_author: Phonlakrit Lookyee
copyright: Copyright &copy; 2026 Phonlakrit Lookyee &middot; MIT License
repo_url: https://github.com/taofuuu/MLRacecar
repo_name: taofuuu/MLRacecar
edit_uri: edit/main/docs/

# Any warning fails the build: broken links, broken #anchors, and pages missing from the nav.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Vision: vision.md
  - Architecture: architecture.md
  - Decisions (ADRs):
      - adr/README.md
      - adr/0001-record-architecture-decisions.md
      - adr/0002-custom-2d-python-simulator.md
      - adr/0003-layered-architecture-pure-core.md
      - adr/0004-track-representation.md
      - adr/0005-batched-multi-car-simulation.md
      - adr/0006-sb3-first-behind-agent-interface.md
      - adr/0007-python-toolchain.md
      - adr/0008-typed-configuration.md
      - adr/0009-development-workflow.md
      - adr/0010-c2-cubic-spline-centerline.md
      - adr/0011-immutable-editor-drafts.md
      - adr/0012-pygame-ce-for-windows-and-drawing.md
      - adr/0013-track-checks-in-the-background.md
      - adr/0014-kinematic-car-model.md
      - ADR template: adr/0000-template.md
  - Track file format: track-format.md
  - Settings: configuration.md
  - Car physics: vehicle-model.md
  - Race rules: race-rules.md
  - Sensors: sensors.md
  - Observations: observations.md
  - Rewards and episodes: rewards.md
  - The RL environment: environment.md
  - Trained agents: agents.md
  - Training: training.md
  - Evaluation: evaluation.md
  - RL fundamentals: rl-guide.md
  - Roadmap: roadmap.md
  - Glossary: glossary.md
  - API reference: reference.md
  - Contributing: https://github.com/taofuuu/MLRacecar/blob/main/CONTRIBUTING.md
  - Changelog: https://github.com/taofuuu/MLRacecar/blob/main/CHANGELOG.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            members_order: source
            heading_level: 2
            show_submodules: true # new modules appear in the API reference automatically
            docstring_section_style: list
