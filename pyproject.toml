[project]
name = "mlracecar"
version = "0.1.0.dev0"
description = "Design a race track, train an AI to master it with reinforcement learning, then race it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phonlakrit Lookyee" }]
requires-python = ">=3.12"
keywords = ["reinforcement-learning", "racing", "simulation", "gymnasium"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment :: Simulation",
  "Typing :: Typed",
]
dependencies = [
  "gymnasium>=1.4.0",
  "numpy>=2.5.3",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "typer>=0.12",
]

[project.optional-dependencies]
render = ["pygame-ce>=2.5.8"]  # the track editor and race window (ADR-0012)
# Training (ADR-0006). `train` gets PyTorch built for CUDA 13.0 (NVIDIA GPUs) on Windows and
# Linux; `train-cpu` is the same without CUDA, for CI and computers without an NVIDIA GPU.
# Install one or the other, never both (see [tool.uv] below). Pillow makes the TensorBoard videos.
train = ["pillow>=12.3.0", "stable-baselines3>=2.9.0", "tensorboard>=2.21.0", "torch>=2.14.1"]
train-cpu = ["pillow>=12.3.0", "stable-baselines3>=2.9.0", "tensorboard>=2.21.0", "torch>=2.14.1"]

[project.scripts]
racecar = "mlracecar.cli:app"

[project.urls]
Homepage = "https://github.com/taofuuu/MLRacecar"
Documentation = "https://github.com/taofuuu/MLRacecar/tree/main/docs"
Issues = "https://github.com/taofuuu/MLRacecar/issues"
Changelog = "https://github.com/taofuuu/MLRacecar/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mlracecar[render]",  # the editor and renderer are tested in CI too
  "hypothesis>=6.168.5",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-benchmark>=5.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "types-pyyaml>=6.0.12.20260906",
]
docs = [
  # MkDocs 2.0 drops the plugin system that mkdocs-material and mkdocstrings rely on,
  # so stay on 1.x until we migrate (see ADR-0007 amendments).
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- #
# PyTorch builds (M4-1): CUDA 13.0 for `train`, CPU-only for `train-cpu`
# --------------------------------------------------------------------------- #

[tool.uv]
conflicts = [[{ extra = "train" }, { extra = "train-cpu" }]]

[tool.uv.sources]
# PyPI's Windows torch has no CUDA, so it comes from PyTorch's own index; on macOS, from PyPI.
torch = [
  { index = "pytorch-cu130", extra = "train", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "train-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only for torch

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --------------------------------------------------------------------------- #
# Lint and format (ADR-0007)
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort: import order
  "N",       # pep8-naming
  "UP",      # pyupgrade: modern syntax for our Python version
  "B",       # bugbear: likely bugs
  "SIM",     # simplifications
  "C4",      # comprehensions
  "RET",     # return statements
  "PTH",     # pathlib over os.path
  "TID",     # tidy imports (no relative imports)
  "T20",     # no stray print()
  "NPY",     # NumPy-specific rules
  "PT",      # pytest style
  "RUF",     # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]  # command-line scripts report progress with print()

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- #
# Type checking (ADR-0007)
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tensorboard.*"]  # TensorBoard has no type hints; only training code uses it
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# Architecture rules (ADR-0003, architecture.md section 2)
# The "core imports only stdlib + NumPy" allow-list lives in tests/unit/test_architecture.py.
# --------------------------------------------------------------------------- #

[tool.importlinter]
root_package = "mlracecar"
include_external_packages = true  # so contracts can name third-party packages like pygame

[[tool.importlinter.contracts]]
name = "Layers: each layer imports only the layers below it"
type = "layers"
layers = [
  "mlracecar.cli",
  "mlracecar.editor | mlracecar.training | mlracecar.play",
  "mlracecar.agents",
  "mlracecar.env | mlracecar.render",
  "mlracecar.config | mlracecar.io",
  "mlracecar.core",
]

[[tool.importlinter.contracts]]
name = "Only drawing code imports pygame: everything else runs headless"
type = "forbidden"
source_modules = [
  "mlracecar.core",
  "mlracecar.config",
  "mlracecar.io",
  "mlracecar.env",
  "mlracecar.agents",
  "mlracecar.training",
  "mlracecar.render.camera",
  "mlracecar.editor.draft",
  "mlracecar.editor.controller",
  "mlracecar.editor.document",
  "mlracecar.editor.checks",
  "mlracecar.editor.history",
]
forbidden_modules = ["pygame"]

[[tool.importlinter.contracts]]
name = "Only training code imports PyTorch and the other training libraries: the simulation and environments run without them"
type = "forbidden"
source_modules = [
  "mlracecar.core",
  "mlracecar.config",
  "mlracecar.io",
  "mlracecar.env",
  "mlracecar.render",
  "mlracecar.editor",
  "mlracecar.play",
]
forbidden_modules = ["torch", "stable_baselines3", "tensorboard", "PIL"]

[[tool.importlinter.contracts]]
name = "The renderer draws snapshots: it never runs or changes the simulation"
type = "forbidden"
source_modules = ["mlracecar.render"]
forbidden_modules = [
  "mlracecar.core.world",
  "mlracecar.core.vehicle.dynamics",
  "mlracecar.core.vehicle.kinematic",
  "mlracecar.core.race.rules",
  "mlracecar.core.race.progress",
]

# --------------------------------------------------------------------------- #
# Tests (architecture.md section 6)
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"] # shared test helpers, e.g. `from strategies import track_like_points`
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  # Slow, GPU, and benchmark tests are opt-in, e.g. `uv run pytest -m slow --no-cov`
  # (alone they can't reach the coverage minimum, and coverage slows down what is timed).
  "-m", "not slow and not gpu and not benchmark",
  "--cov=mlracecar",
  "--cov-report=term-missing:skip-covered",
]
markers = [
  "slow: takes more than a few seconds (e.g. smoke training runs)",
  "gpu: needs a CUDA GPU",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mlracecar"]
omit = ["*/mlracecar/__main__.py"]  # two-line entry point, exercised via the CLI tests

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
