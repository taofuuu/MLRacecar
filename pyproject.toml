[project]
name = "mlracecar"
version = "0.1.0.dev0"
description = "Design a race track, train an AI to master it with reinforcement learning, then race it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phonlakrit Lookyee" }]
requires-python = ">=3.12"
keywords = ["reinforcement-learning", "racing", "simulation", "gymnasium"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment :: Simulation",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.5.3",
  "typer>=0.12",
]

[project.optional-dependencies]
# Filled in by later tickets; declared now so the install commands never change.
render = []  # pygame (M2-6)
train = []   # torch, stable-baselines3, tensorboard (M4-1)

[project.scripts]
racecar = "mlracecar.cli:app"

[project.urls]
Homepage = "https://github.com/taofuuu/MLRacecar"
Documentation = "https://github.com/taofuuu/MLRacecar/tree/main/docs"
Issues = "https://github.com/taofuuu/MLRacecar/issues"
Changelog = "https://github.com/taofuuu/MLRacecar/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "hypothesis>=6.168.5",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-benchmark>=5.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
]
docs = [
  # MkDocs 2.0 drops the plugin system that mkdocs-material and mkdocstrings rely on,
  # so stay on 1.x until we migrate (see ADR-0007 amendments).
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- #
# Lint and format (ADR-0007)
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort: import order
  "N",       # pep8-naming
  "UP",      # pyupgrade: modern syntax for our Python version
  "B",       # bugbear: likely bugs
  "SIM",     # simplifications
  "C4",      # comprehensions
  "RET",     # return statements
  "PTH",     # pathlib over os.path
  "TID",     # tidy imports (no relative imports)
  "T20",     # no stray print()
  "NPY",     # NumPy-specific rules
  "PT",      # pytest style
  "RUF",     # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]  # command-line scripts report progress with print()

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- #
# Type checking (ADR-0007)
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --------------------------------------------------------------------------- #
# Architecture rules (ADR-0003, architecture.md section 2)
# The "core imports only stdlib + NumPy" allow-list lives in tests/unit/test_architecture.py.
# --------------------------------------------------------------------------- #

[tool.importlinter]
root_package = "mlracecar"

[[tool.importlinter.contracts]]
name = "Layers: each layer imports only the layers below it"
type = "layers"
layers = [
  "mlracecar.cli",
  "mlracecar.editor | mlracecar.training",
  "mlracecar.agents",
  "mlracecar.env | mlracecar.render",
  "mlracecar.config | mlracecar.io",
  "mlracecar.core",
]

# --------------------------------------------------------------------------- #
# Tests (architecture.md section 6)
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"] # shared test helpers, e.g. `from strategies import track_like_points`
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  # Slow, GPU, and benchmark tests are opt-in: `uv run pytest -m slow` (or gpu / benchmark).
  "-m", "not slow and not gpu and not benchmark",
  "--cov=mlracecar",
  "--cov-report=term-missing:skip-covered",
]
markers = [
  "slow: takes more than a few seconds (e.g. smoke training runs)",
  "gpu: needs a CUDA GPU",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mlracecar"]
omit = ["*/mlracecar/__main__.py"]  # two-line entry point, exercised via the CLI tests

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
