name: Bug
description: Something behaves differently from what the docs or tests say it should.
labels: ["type:bug"]
projects: ["taofuuu/3"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include error messages and screenshots if you have them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands, track file, config, and seed, so someone else gets the same result.
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uv run racecar --version`, or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant output. It's formatted as code automatically.
      render: shell
