# Runs on every pull request and every push to main. Branch protection on main requires
# all jobs below to pass before a PR can be merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # same syntax on Ubuntu and Windows runners

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no major tag published; pinned to the release commit)
        with:
          enable-cache: true

      # With the training libraries (CPU-only PyTorch), so mypy can check the code that uses them.
      - name: Install dependencies (must match uv.lock exactly)
        run: uv sync --locked --extra train-cpu

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks developers run on every commit: one definition, used locally and in CI.
      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false # report every OS, even if one fails
      matrix:
        include:
          # Linux also installs the training libraries (CPU-only PyTorch), so their tests run;
          # Windows doesn't, which shows that everything else runs without them.
          - os: ubuntu-latest
            extras: --extra train-cpu
          - os: windows-latest
            extras: ""
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no major tag published; pinned to the release commit)
        with:
          enable-cache: true

      - name: Install dependencies (must match uv.lock exactly)
        run: uv sync --locked ${{ matrix.extras }}

      - name: Check the training libraries load, with CPU-only PyTorch
        if: matrix.extras != ''
        run: |
          uv run --no-sync racecar doctor
          uv run --no-sync python -c "
          import stable_baselines3, tensorboard, torch
          assert torch.version.cuda is None, 'expected CPU-only PyTorch'
          "

      - name: Run tests with coverage
        run: uv run pytest

      # The slow tests: the smoke training run (configs/smoke.yaml, twice: it must take under
      # a minute and give the same results) and 10,000 random-driver steps.
      - name: Run the slow tests, the smoke training run among them
        if: matrix.extras != ''
        run: uv run --no-sync pytest -m slow --no-cov

      - name: Add coverage table to the job summary
        if: always()
        run: |
          echo "### Coverage (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
