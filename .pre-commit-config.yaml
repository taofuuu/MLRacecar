# Checks that run on every `git commit` (install once with `uv run pre-commit install`).
# ruff and mypy run through uv, so they use the exact versions pinned in uv.lock,
# the same ones CI uses.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe] # syntax-only, so mkdocs.yml's !!python/name tag is accepted
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: import-linter
        name: import-linter (architecture layers)
        entry: uv run --frozen lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
