  "Point-to-polyline projection: closest point, segment index, arc length, signed lateral offset",
  "Polyline self-intersection check",
]
acceptance = [
  "Hypothesis property tests (e.g. projected distance <= distance to any vertex; intersection is symmetric)",
  "No Python-level loops over points in hot paths",
  "mypy strict passes; 100% branch coverage for the module",
]
