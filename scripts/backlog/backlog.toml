description = "Documentation"

[[labels]]
name = "type:research"
color = "d876e3"
description = "Spike, experiment, or investigation with a written outcome"

[[labels]]
name = "type:bug"
color = "d73a4a"
description = "Something is broken"

[[labels]]
name = "type:refactor"
color = "fef2c0"
description = "Code change without behaviour change"

[[labels]]
name = "priority:P0"
color = "b60205"
description = "Must-have for its milestone"

[[labels]]
name = "priority:P1"
color = "d93f0b"
description = "Should-have; cut if the milestone is at risk"

[[labels]]
name = "priority:P2"
color = "fbca04"
description = "Nice-to-have"

[[labels]]
name = "size:S"
color = "c2e0c6"
description = "Small: a focused change"

[[labels]]
name = "size:M"
