# Initial backlog for MLRacecar.
#
# This file seeds GitHub (labels, milestones, issues) via seed_github.py.
# After seeding, GitHub Issues is the source of truth; this file stays as the
# record of the initial plan. M0-M4 are planned in detail; M5-M8 are epic-level
# and get refined when we reach them (rolling-wave planning).
#
# Sizes are relative complexity, not hours: S = small, M = medium, L = large.

# --------------------------------------------------------------------------- #
# Labels
# --------------------------------------------------------------------------- #

[[labels]]
name = "type:feature"
color = "1d76db"
description = "New capability"

[[labels]]
name = "type:chore"
color = "cfd3d7"
description = "Tooling, infrastructure, maintenance"

[[labels]]
