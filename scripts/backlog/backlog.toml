summary = "Create the repository skeleton that every later ticket builds on, including the planning documents."
tasks = [
  "MIT LICENSE, README, CHANGELOG (Keep a Changelog format)",
  "`.gitignore` (Python, uv, IDEs, `runs/`), `.gitattributes` (LF normalization), `.editorconfig`",
  "Planning docs: vision, architecture, ADRs 0001-0009, roadmap, CONTRIBUTING",
  "Public GitHub repository with `main` as default branch",
]
acceptance = [
  "Repository is public on GitHub and README links to all planning docs",
  "Line endings are normalized so Windows and Linux checkouts produce identical files",
]

[[issues]]
key = "M0-2"
milestone = "M0"
title = "Scaffold the Python package with uv"
labels = ["type:chore", "area:infra", "priority:P0", "size:S"]
summary = "Set up a reproducible Python project using uv and a `src/` layout."
tasks = [
  "Install uv; pin Python 3.12 with `.python-version`",
  "`pyproject.toml` with project metadata, `src/mlracecar/` package, `py.typed` marker",
  "Optional dependency groups declared (empty for now): `render`, `train`, `dev`",
