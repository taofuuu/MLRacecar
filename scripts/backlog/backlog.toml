color = "c5def5"
description = "Browser demo"

# --------------------------------------------------------------------------- #
# Milestones
# --------------------------------------------------------------------------- #

[[milestones]]
key = "M0"
title = "M0: Foundations"
due = "2026-10-13"
description = "Goal: a professional repo skeleton where every later ticket lands safely. Demo: a PR with green CI (lint, types, tests, architecture rules) on Windows + Linux."

[[milestones]]
key = "M1"
title = "M1: Tracks"
due = "2026-10-27"
description = "Goal: design, validate and save your own tracks. Demo: build a new track in the editor in under 5 minutes."

[[milestones]]
key = "M2"
title = "M2: Drivable simulation"
due = "2026-11-10"
description = "Goal: vehicle physics, race rules and a renderer. Demo: drive your own track with the keyboard and set a lap time."

[[milestones]]
key = "M3"
title = "M3: RL environment"
due = "2026-11-24"
description = "Goal: a fast, standards-compliant RL environment. Demo: random agent in a Gymnasium env, with throughput benchmarks."

[[milestones]]
key = "M4"
title = "M4: MVP - First lap (v0.1.0)"
due = "2026-12-08"
description = "Goal: an agent learns to lap your track, reproducibly. Demo: GIF of the trained agent, eval report, v0.1.0 release."

[[milestones]]
key = "M5"
title = "M5: Generalize and play (v0.2.0)"
description = "Goal: agents that drive unseen tracks, and you can race them. Demo: you vs. AI on a freshly generated track."

[[milestones]]
key = "M6"
title = "M6: Browser demo (v0.3.0)"
description = "Goal: anyone can watch the agent race from a link. Demo: public GitHub Pages URL."

[[milestones]]
key = "M7"
title = "M7: Multi-car racing (v0.4.0)"
description = "Goal: cars that race and overtake each other. Demo: a 6-car self-play race."

[[milestones]]
key = "M8"
title = "M8: ML deep dive (v1.0.0)"
description = "Goal: own PPO implementation, rigorous benchmarks and ablations. Demo: technical write-up with results and confidence intervals."

