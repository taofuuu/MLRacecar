# MLRacecar settings: every setting with its value.
# To change a few, write a file with just those lines (under their section), or use
# --set, e.g. `racecar config --set vehicle.mass=1500`.

# The car: its size, steering, engine and brakes, and what slows it down.
vehicle:
  length: 4.5                # Length of the body, in metres.
  width: 2                   # Width of the body, in metres.
  wheelbase: 2.7             # Front axle to rear axle, in metres.
  mass: 1300                 # The car's mass, in kilograms.
  max_steer: 30              # How far the front wheels turn at full lock, in degrees.
  steer_rate: 90             # How fast the front wheels can turn, in degrees per second.
  grip: 1                    # Tyre grip: the hardest the car can corner, in g (gravity = 1).
  max_drive_force: 8000      # The engine's push at low speed, in newtons.
  max_power: 200             # Engine power in kilowatts; it limits the push at high speed.
  max_brake_force: 13000     # The brakes' strongest push, in newtons.
  drag_coefficient: 0.32     # Air resistance of the car's shape (Cd, no unit).
  frontal_area: 2            # Size of the car seen from the front, in square metres.
  rolling_resistance: 0.015  # Tyre rolling resistance, as a fraction of the car's weight.

# How simulated time moves forward.
simulation:
  physics_hz: 120   # Physics steps per simulated second.
  action_repeat: 6  # Physics steps per driver decision (120 / 6 = 20 decisions a second).
