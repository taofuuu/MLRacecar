# MLRacecar settings: every setting with its value.
# To change a few, write a file with just those lines (under their section), or use
# --set, e.g. `racecar config --set vehicle.mass=1500`.

# The car: its size, steering, engine and brakes, and what slows it down.
vehicle:
  length: 4.5                # Length of the body, in metres.
  width: 2                   # Width of the body, in metres.
  wheelbase: 2.7             # Front axle to rear axle, in metres.
  mass: 1300                 # The car's mass, in kilograms.
  max_steer: 30              # How far the front wheels turn at full lock, in degrees.
  steer_rate: 180            # How fast the front wheels can turn, in degrees per second.
  grip: 2                    # Tyre grip: the hardest the car can corner, in g (gravity = 1).
  max_drive_force: 12000     # The engine's push at low speed, in newtons.
  max_power: 250             # Engine power in kilowatts; it limits the push at high speed.
  max_brake_force: 37000     # The brakes' strongest push, in newtons.
  drag_coefficient: 0.32     # Air resistance of the car's shape (Cd, no unit).
  frontal_area: 2            # Size of the car seen from the front, in square metres.
  rolling_resistance: 0.015  # Tyre rolling resistance, as a fraction of the car's weight.

# How simulated time moves forward.
simulation:
  physics_hz: 120   # Physics steps per simulated second.
  action_repeat: 6  # Physics steps per driver decision (120 / 6 = 20 decisions a second).

# The race rules: what happens when a car leaves the road.
race:
  off_track: slowdown  # When a car's centre leaves the road: none, slowdown, reset, or terminate.
  grass_slowdown: 6    # How hard grass slows a car, in m/s per second (off_track: slowdown).

# The car's distance sensors: how many rays, how wide they fan, and how far they reach.
sensors:
  rays: 15            # How many rays fan out from the car.
  field_of_view: 180  # The angle they fan across, in degrees, centred on where the car points.
  range: 100          # How far they reach, in metres.

# What the AI sees: each input can be turned off with false.
observation:
  rays: true             # The distance rays, each as a fraction of their range.
  speed: true            # The car's forward speed.
  heading: true          # Which way the car points compared with the road (2 values).
  offset: true           # Distance from the middle of the road, as a share of half its width.
  yaw_rate: true         # How fast the car is turning.
  steering: true         # Where the front wheels point now, as a share of full lock.
  previous_action: true  # The steering and pedal it chose last time (2 values).
  curvature: true        # How much the road bends in each stretch ahead (one value per stretch).
  lookahead: 150         # How far ahead the bends are measured, in metres.
  lookahead_points: 8    # How many equal stretches that distance is split into.

# How the AI is scored: the weight of each part of the reward (0 turns it off).
reward:
  progress: 0.1  # Points per metre gained along the lap; going backwards loses them.
  off_track: 10  # Points lost each time the car's centre leaves the road.
  time: 0        # Points lost per second of racing.
  wrong_way: 0   # Points lost per second spent driving the wrong way.
  smoothness: 0  # Points lost per squared change of steering and pedal between decisions.
  lap: 0         # Points for each valid lap.

# When a training run ends: leaving the road, the time limit, or getting stuck.
episode:
  end_off_track: true  # End the run as soon as the car's centre leaves the road.
  time_limit: 60       # The longest a run lasts, in seconds of racing.
  stuck_time: 5        # End the run after this many seconds in a row slower than 1 m/s.
  start: grid          # Where runs start: grid, or random (anywhere on the lap).

# A training run: the track, how long, how many cars, and how often to save and test.
training:
  track: tracks/technical.json  # The track file to train on.
  steps: 1000000                # How long to train, in car-steps (16 cars x 1 step = 16).
  cars: 16                      # Cars practising at once, in one world.
  seed: 0                       # Same settings + same seed = the same run.
  device: cpu                   # Where the network learns: cpu (fastest here), cuda, or auto.
  checkpoint_every: 100000      # Save the AI every this many car-steps, and at the end.
  eval_every: 50000             # Test it every this many car-steps, and at the end.
  eval_runs: 10                 # Test runs, from the same random places each time.

# How PPO, the learning algorithm, learns.
ppo:
  learning_rate: 0.0003  # How big each learning step is.
  steps_per_car: 128     # Steps each car drives between updates (x cars = experience per update).
  batch_size: 256        # Steps per learning step; must divide the experience per update.
  epochs: 10             # Passes over each update's experience.
  gamma: 0.99            # Discount: how much later rewards count (0.99: about 5 s ahead).
  gae_lambda: 0.95       # GAE lambda: trades a little accuracy for less noise in the advantages.
  clip_range: 0.2        # How far one update may move the policy (the clip, epsilon).
  entropy_coef: 0        # Bonus for staying random, to keep exploring.
  layers: 2              # Hidden layers in the policy and value networks.
  layer_size: 64         # Neurons in each hidden layer.
